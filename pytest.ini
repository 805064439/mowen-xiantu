[pytest]
# 默认只跑本地后端单测；线上 e2e 需显式指定路径（会打真实环境、消耗 token）
testpaths = tests/backend
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --tb=short --strict-markers
markers =
    slow: 会真实调用 AI / 反复冲击结局，耗时较长且消耗 token
    smoke: 只读探测，不消耗 token
    ai: 依赖真实模型输出
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
